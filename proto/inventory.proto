syntax = "proto3";

package inventory;

// ─────────────────────────────────────────────
// Serviço gRPC de Estoque (Inventory Service)
// ─────────────────────────────────────────────
service InventoryService {
  // Unary: verifica se um produto tem estoque suficiente
  rpc CheckStock (CheckStockRequest) returns (CheckStockResponse);

  // Unary: reserva itens de um pedido inteiro
  rpc ReserveItems (ReserveItemsRequest) returns (ReserveItemsResponse);

  // Server Streaming: lista produtos com estoque abaixo de um limite
  rpc ListLowStock (ListLowStockRequest) returns (stream ProductStock);
}

// ── CheckStock ──────────────────────────────
message CheckStockRequest {
  string product_id = 1;
  int32  quantity   = 2;
}

message CheckStockResponse {
  bool   available      = 1;
  int32  current_stock  = 2;
  string product_name   = 3;
  string message        = 4;
}

// ── ReserveItems ────────────────────────────
message OrderItem {
  string product_id = 1;
  int32  quantity   = 2;
}

message ReserveItemsRequest {
  string            order_id = 1;
  repeated OrderItem items   = 2;
}

message ReserveItemsResponse {
  bool   success  = 1;
  string order_id = 2;
  string message  = 3;
}

// ── ListLowStock (Streaming) ─────────────────
message ListLowStockRequest {
  int32 threshold = 1;
}

message ProductStock {
  string product_id = 1;
  string name       = 2;
  int32  stock      = 3;
  string category   = 4;
}
